[project]
name = "detecteval"
version = "0.1.0"
description = "Proofmark: AI-likelihood scores for writing with measured error rates, and the evaluation behind them"
license = "MIT"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "duckdb>=1.1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]
# Local detectors (Binoculars and the trained classifier). Not needed for the tests or the report.
ml = ["torch>=2.6", "transformers>=4.48", "accelerate>=1.2"]
# The detector web app and MCP server. Needs the ml group as well, for the model worker.
serve = ["starlette>=0.40", "uvicorn>=0.30", "mcp>=2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/detecteval"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
